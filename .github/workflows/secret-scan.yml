name: secret-scan

# 手元の注意力ではなく、**仕組みで止める。**
#
# このリポジトリは public で GitHub Pages も有効。うっかり入った鍵は
# 認証なしで誰でも読める（実際に .mcp.json の API キーが読める状態だった）。
# CLAUDE.md 3.1「シークレットを一切書かない」を、人ではなく CI に守らせる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: 鍵が混ざっていないか見る
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 公式リリースのバイナリを、**チェックサムを照合してから**使う。
      # 第三者 Action を信頼する面を増やさない（鍵を見る仕組み自体が
      # 乗っ取られると意味がないため）
      - name: gitleaks を用意する
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # `--redact` は必須。**このリポジトリは public なので CI のログも公開される。**
      # 付け忘れると、検知した鍵そのものをログに出してしまう。
      #
      # `--no-git` はいまのファイルだけを見る。過去の履歴は見ない。
      # 履歴には既に露出した鍵が残っているが、そこで毎回落ちても直せない
      # （履歴の書き換えは別作業）。**これから入るものを止める**のが目的。
      - name: いまのファイルを見る
        run: ./gitleaks detect --no-git --redact --verbose --exit-code 1
